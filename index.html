<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>소방안전 AR 농연 체험</title>

  <style>
    body, html {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden; background-color: black;
    }

    #camera-container {
      position: absolute; top: 0; left: 0;
      width: 100vw; height: 100vh;
      overflow: hidden; z-index: 1;
    }

    /* 아이폰 16 프로 배율 이상 현상 해결을 위한 비디오 스케일링 */
    #webcam-video {
      width: 100%; height: 100%;
      object-fit: cover;
      transform: scale(1.0); /* 필요 시 줌 비율 보정 */
    }

    #smoke-container {
      position: absolute; top: -20vh; left: 0;
      width: 100vw; height: 140vh;
      z-index: 2; pointer-events: none;
      opacity: 0.98;
      transition: opacity 0.4s ease-out, transform 0.4s ease-out;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,0.98) 60%, rgba(0,0,0,0) 95%);
      -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,0.98) 60%, rgba(0,0,0,0) 95%);
    }

    .smoke-layer-dark {
      position: absolute; top: -20%; left: -25%; width: 150vw; height: 160vh;
      background: radial-gradient(circle at 50% 40%, rgba(2, 2, 2, 1) 0%, rgba(5, 5, 5, 0.96) 60%, transparent 90%);
      filter: url(#smoke-texture-1) blur(6px);
      animation: moveDark 18s infinite ease-in-out;
    }

    .smoke-layer-gray {
      position: absolute; top: -10%; left: -20%; width: 140vw; height: 150vh;
      background: radial-gradient(circle at 45% 45%, rgba(170, 165, 160, 0.98) 0%, rgba(70, 65, 60, 0.88) 55%, transparent 90%);
      filter: url(#smoke-texture-gray) blur(8px);
      mix-blend-mode: screen;
      animation: moveGray 11s infinite ease-in-out;
    }

    .smoke-layer-light {
      position: absolute; top: 0%; left: -10%; width: 125vw; height: 140vh;
      background: radial-gradient(circle at 55% 35%, rgba(120, 120, 120, 0.85) 0%, rgba(30, 30, 30, 0.65) 55%, transparent 85%);
      filter: url(#smoke-texture-1) blur(14px);
      animation: moveLight 8s infinite ease-in-out;
    }

    @keyframes moveDark { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    @keyframes moveGray { 0%, 100% { transform: scale(1.02); } 50% { transform: scale(1.09); } }
    @keyframes moveLight { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }

    #start-notice {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: white; font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 17px; font-weight: bold;
      background: rgba(0, 0, 0, 0.85);
      border: 1.5px solid #00ffcc;
      padding: 22px 36px; border-radius: 35px;
      z-index: 10; text-align: center;
      box-shadow: 0 0 20px rgba(0,255,204,0.3);
    }

    #status-bar {
      position: absolute; top: 15px; left: 15px;
      color: #00ffcc; font-size: 11px; font-family: monospace;
      z-index: 20; background: rgba(0,0,0,0.7); padding: 6px 12px; border-radius: 6px;
    }
  </style>
</head>

<body>

  <div id="status-bar">상태: 터치 대기 중</div>

  <div id="camera-container">
    <video id="webcam-video" autoplay playsinline muted></video>
  </div>

  <svg style="display:none;">
    <filter id="smoke-texture-1">
      <feTurbulence id="turbulence-1" type="fractalNoise" baseFrequency="0.012 0.018" numOctaves="4" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="55" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <filter id="smoke-texture-gray">
      <feTurbulence id="turbulence-gray" type="fractalNoise" baseFrequency="0.02 0.028" numOctaves="4" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="75" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>

  <div id="smoke-container">
    <div class="smoke-layer-dark"></div>
    <div class="smoke-layer-gray"></div>
    <div class="smoke-layer-light"></div>
  </div>

  <div id="start-notice">👆 화면을 터치하여<br>체험을 시작하세요</div>

  <script>
    const video = document.getElementById('webcam-video');
    const smokeContainer = document.getElementById('smoke-container');
    const startNotice = document.getElementById('start-notice');
    const statusBar = document.getElementById('status-bar');

    let rawBeta = 80;
    let smoothBeta = 80;

    function setStatus(msg) {
      statusBar.innerText = "상태: " + msg;
    }

    // iOS 18 최적화 카메라 구동
    async function initCamera() {
      try {
        const constraints = {
          video: {
            facingMode: "environment",
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          },
          audio: false
        };

        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;
        await video.play();
        setStatus("카메라 준비 완료 (1x)");
        return true;
      } catch (e) {
        try {
          // 광각 제약 실패 시 기본 카메라로 폴백
          const fallback = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
          video.srcObject = fallback;
          await video.play();
          setStatus("기본 카메라 연결됨");
          return true;
        } catch (err) {
          setStatus("카메라 권한 오류");
          return false;
        }
      }
    }

    function handleOrientation(e) {
      if (e.beta !== null && e.beta !== undefined) {
        rawBeta = Math.abs(e.beta);
        setStatus("센서 정상 동작 중 (" + Math.round(rawBeta) + "°)");
      }
    }

    // iOS 18 동작 센서 동기화 요청
    async function initSensor() {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const res = await DeviceOrientationEvent.requestPermission();
          if (res === 'granted') {
            window.addEventListener('deviceorientation', handleOrientation, true);
          } else {
            setStatus("센서 권한이 거부되었습니다.");
          }
        } catch (err) {
          window.addEventListener('deviceorientation', handleOrientation, true);
        }
      } else {
        window.addEventListener('deviceorientation', handleOrientation, true);
      }
    }

    function renderFrame() {
      smoothBeta += (rawBeta - smoothBeta) * 0.05;

      let progress = (80 - smoothBeta) / 35;
      progress = Math.min(Math.max(progress, 0.0), 1.0);

      smokeContainer.style.transform = `translateY(${-(progress * 45)}%)`;
      smokeContainer.style.opacity = 0.98 - (progress * 0.73);

      requestAnimationFrame(renderFrame);
    }

    // 터치 원클릭 초기화 (iOS 18 필수 방식)
    async function startApp() {
      startNotice.style.display = 'none';
      setStatus("하드웨어 연결 중...");

      await initSensor();
      const camSuccess = await initCamera();

      if (camSuccess) {
        renderFrame();
      }
    }

    startNotice.addEventListener('click', startApp);
    startNotice.addEventListener('touchstart', startApp);
  </script>
</body>
</html>
