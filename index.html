<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>소방안전 AR 농연 체험</title>

  <style>
    body, html {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden; background-color: black;
    }

    #webcam-video {
      position: absolute; top: 0; left: 0;
      width: 100vw; height: 100vh;
      object-fit: cover; z-index: 1;
    }

    #smoke-container {
      position: absolute; top: -20vh; left: 0;
      width: 100vw; height: 140vh;
      z-index: 2; pointer-events: none;
      opacity: 0.98;
      transition: opacity 0.3s ease-out, transform 0.3s ease-out;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,0.98) 60%, rgba(0,0,0,0) 95%);
      -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,0.98) 60%, rgba(0,0,0,0) 95%);
    }

    .smoke-layer-dark {
      position: absolute; top: -20%; left: -25%; width: 150vw; height: 160vh;
      background: radial-gradient(circle at 50% 40%, rgba(2, 2, 2, 1) 0%, rgba(5, 5, 5, 0.96) 60%, transparent 90%);
      filter: url(#smoke-texture-1) blur(6px);
      animation: moveDark 18s infinite ease-in-out;
    }

    .smoke-layer-gray {
      position: absolute; top: -10%; left: -20%; width: 140vw; height: 150vh;
      background: radial-gradient(circle at 45% 45%, rgba(170, 165, 160, 0.98) 0%, rgba(70, 65, 60, 0.88) 55%, transparent 90%);
      filter: url(#smoke-texture-gray) blur(8px);
      mix-blend-mode: screen;
      animation: moveGray 11s infinite ease-in-out;
    }

    .smoke-layer-light {
      position: absolute; top: 0%; left: -10%; width: 125vw; height: 140vh;
      background: radial-gradient(circle at 55% 35%, rgba(120, 120, 120, 0.85) 0%, rgba(30, 30, 30, 0.65) 55%, transparent 85%);
      filter: url(#smoke-texture-1) blur(14px);
      animation: moveLight 8s infinite ease-in-out;
    }

    @keyframes moveDark { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    @keyframes moveGray { 0%, 100% { transform: scale(1.02); } 50% { transform: scale(1.09); } }
    @keyframes moveLight { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }

    #start-notice {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: white; font-family: sans-serif;
      font-size: 16px; font-weight: bold;
      background: rgba(0, 0, 0, 0.8);
      border: 1px solid #00ffcc;
      padding: 18px 32px; border-radius: 30px;
      z-index: 10; text-align: center;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <video id="webcam-video" autoplay playsinline muted></video>

  <svg style="display:none;">
    <filter id="smoke-texture-1">
      <feTurbulence id="turbulence-1" type="fractalNoise" baseFrequency="0.012 0.018" numOctaves="4" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="55" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <filter id="smoke-texture-gray">
      <feTurbulence id="turbulence-gray" type="fractalNoise" baseFrequency="0.02 0.028" numOctaves="4" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="75" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>

  <div id="smoke-container">
    <div class="smoke-layer-dark"></div>
    <div class="smoke-layer-gray"></div>
    <div class="smoke-layer-light"></div>
  </div>

  <div id="start-notice">터치하여 체험 시작</div>

  <script>
    const video = document.getElementById('webcam-video');
    const smokeContainer = document.getElementById('smoke-container');
    const startNotice = document.getElementById('start-notice');
    const turbulence1 = document.getElementById('turbulence-1');

    let rawBeta = 80;
    let smoothBeta = 80;

    // 1. 기본 카메라 구동
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" } },
          audio: false
        });
        video.srcObject = stream;
        await video.play();
      } catch (err) {
        console.error("Camera error:", err);
      }
    }

    // 2. 동작 센서 핸들러
    function handleOrientation(event) {
      if (event.beta !== null) {
        rawBeta = Math.abs(event.beta);
      }
    }

    // 센서 권한 요청
    function requestSensorPermission() {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission()
          .then(permissionState => {
            if (permissionState === 'granted') {
              window.addEventListener('deviceorientation', handleOrientation);
            }
          });
      } else {
        window.addEventListener('deviceorientation', handleOrientation);
      }
    }

    // 3. 각도에 따른 연기 높이 및 변형 속도 제어
    function updateSmokeEffect() {
      // 부드러운 각도 전환 (LERP)
      smoothBeta += (rawBeta - smoothBeta) * 0.05;

      // 직립(80도) ~ 숙임(45도) 사이 진행도 계산 (0.0 ~ 1.0)
      let progress = (80 - smoothBeta) / 35;
      progress = Math.min(Math.max(progress, 0.0), 1.0);

      // A. 위치 및 투명도 조절
      smokeContainer.style.transform = `translateY(${-(progress * 45)}%)`;
      smokeContainer.style.opacity = 0.98 - (progress * 0.73);

      // B. 각도(숙임 정도)에 따른 연기 텍스처 변형 속도 제어
      // 숙일수록 연기가 유기적이고 빠르게 흩어지도록 baseFrequency 조절
      const speedFactor = 0.012 + (progress * 0.015);
      turbulence1.setAttribute('baseFrequency', `${speedFactor} ${speedFactor * 1.5}`);

      requestAnimationFrame(updateSmokeEffect);
    }

    // 초기화
    function initApp() {
      startNotice.style.display = 'none';
      requestSensorPermission();
      startCamera();
      updateSmokeEffect();
    }

    startNotice.addEventListener('click', initApp);
  </script>
</body>
</html>
