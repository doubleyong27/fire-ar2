<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>소방안전 AR 농연 체험</title>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: black;
    }

    /* 1. 순수 스마트폰 카메라 비디오 화면 (배경) */
    #webcam-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
    }

    /* 2. 실제 연기 질감 텍스처 (오버레이 레이어) */
    #smoke-layer {
      position: absolute;
      top: -10%;
      left: -10%;
      width: 120vw;
      height: 120vh;
      background-image: url('https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/lava/cloud.png');
      background-size: cover;
      background-position: center;
      filter: invert(1) brightness(0.15) contrast(1.8);
      opacity: 0.85; /* 초기 상태: 검은 연기 가득함 */
      pointer-events: none;
      z-index: 2;
      transition: opacity 0.2s ease;
      animation: smokeMove 12s infinite linear;
    }

    /* 연기가 살렁거리는 효과 */
    @keyframes smokeMove {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-3%, -2%) scale(1.05); }
      100% { transform: translate(0, 0) scale(1); }
    }

    /* 시작 안내 메시지 */
    #start-notice {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-family: sans-serif;
      font-size: 18px;
      font-weight: bold;
      background: rgba(0, 0, 0, 0.7);
      padding: 15px 25px;
      border-radius: 30px;
      z-index: 3;
      text-align: center;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <!-- 실시간 스마트폰 카메라 영상 -->
  <video id="webcam-video" autoplay playsinline muted></video>

  <!-- 연기 레이어 -->
  <div id="smoke-layer"></div>

  <!-- 화면 터치 안내 안내문 -->
  <div id="start-notice">화면을 터치하여 체험을 시작하세요</div>

  <script>
    const video = document.getElementById('webcam-video');
    const smokeLayer = document.getElementById('smoke-layer');
    const startNotice = document.getElementById('start-notice');

    let currentAccY = 9.8;
    let currentBeta = 0; // 기울기 각도

    // 1. 순수 웹캠/스마트폰 후면 카메라 활성화
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { exact: "environment" } }, // 후면 카메라 우선
          audio: false
        });
        video.srcObject = stream;
      } catch (err) {
        // 후면 카메라 지정 실패 시 일반 카메라로 재시도
        try {
          const fallbackStream = await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: false
          });
          video.srcObject = fallbackStream;
        } catch (e) {
          alert("카메라 권한을 허용해 주세요.");
        }
      }
    }

    // 2. 실시간 기울기/높이에 따른 연기 투명도 계산
    function updateSmokeOpacity() {
      // 1) 고개를 올리는 각도 (beta: 0도 정면 ~ 90도 천장)
      let lookUpScore = currentBeta / 60;
      lookUpScore = Math.min(Math.max(lookUpScore, 0.0), 1.0);

      // 2) 몸 낮춤 높이 (accY: 9.8 서 있음 ~ 2 이하 낮게 숙임)
      let heightScore = (currentAccY - 2) / 6;
      heightScore = Math.min(Math.max(heightScore, 0.0), 1.0);

      // 최종 연기 농도 (자세가 높거나 OR 위를 바라볼 때 자욱해짐)
      let finalOpacity = Math.max(heightScore, lookUpScore) * 0.9;
      smokeLayer.style.opacity = finalOpacity;

      requestAnimationFrame(updateSmokeOpacity);
    }

    // 3. 모션 및 방향 센서 이벤트
    function handleMotion(event) {
      if (event.accelerationIncludingGravity) {
        currentAccY = event.accelerationIncludingGravity.y || 9.8;
      }
    }

    function handleOrientation(event) {
      // event.beta: 스마트폰 전후 기울기 각도
      if (event.beta !== null) {
        currentBeta = event.beta;
      }
    }

    // 4. 터치 시 센서 및 카메라 권한 시작
    function initApp() {
      startNotice.style.display = 'none'; // 안내문 숨김
      startCamera(); // 카메라 시작

      // iOS 권한 요청 처리
      if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        DeviceMotionEvent.requestPermission().then(response => {
          if (response === 'granted') {
            window.addEventListener('devicemotion', handleMotion);
            window.addEventListener('deviceorientation', handleOrientation);
          }
        });
      } else {
        window.addEventListener('devicemotion', handleMotion);
        window.addEventListener('deviceorientation', handleOrientation);
      }

      updateSmokeOpacity();
    }

    window.addEventListener('click', initApp, { once: true });
    window.addEventListener('touchstart', initApp, { once: true });
  </script>
</body>
</html>
