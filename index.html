<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>소방안전 AR 농연 체험</title>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: black;
    }

    /* 1. 후면 카메라 배경 영상 */
    #webcam-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
    }

    /* 2. 입체 연기 컨테이너 */
    #smoke-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      pointer-events: none;
      opacity: 0.9;
      transition: opacity 0.3s cubic-bezier(0.25, 1, 0.5, 1), transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
      
      mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,0.85) 40%, rgba(0,0,0,0) 80%);
      -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,0.85) 40%, rgba(0,0,0,0) 80%);
    }

    /* 레이어 1: 천장 심부 짙은 흑연 */
    .smoke-layer-dark {
      position: absolute;
      top: -35%;
      left: -25%;
      width: 150vw;
      height: 130vh;
      background: radial-gradient(circle at 50% 30%, rgba(10, 10, 10, 0.98) 0%, rgba(3, 3, 3, 0.85) 45%, transparent 75%);
      filter: url(#smoke-texture-1) blur(10px);
      animation: moveDark 18s infinite ease-in-out;
    }

    /* 레이어 2 (신규 추가): 중앙 일렁이는 회색/연갈색 농연 */
    .smoke-layer-gray {
      position: absolute;
      top: -25%;
      left: -20%;
      width: 140vw;
      height: 120vh;
      /* 화재 현장 특유의 회색-연갈색 톤 입자 */
      background: radial-gradient(circle at 45% 35%, rgba(120, 115, 110, 0.75) 0%, rgba(60, 58, 55, 0.5) 40%, transparent 75%);
      filter: url(#smoke-texture-gray) blur(14px);
      mix-blend-mode: screen; /* 실제 빛을 반사하는 회색 연기 질감 표현 */
      animation: moveGray 11s infinite ease-in-out;
    }

    /* 레이어 3: 하부 옅은 유동 연기 */
    .smoke-layer-light {
      position: absolute;
      top: -15%;
      left: -10%;
      width: 125vw;
      height: 105vh;
      background: radial-gradient(circle at 55% 25%, rgba(80, 80, 80, 0.5) 0%, rgba(20, 20, 20, 0.3) 45%, transparent 70%);
      filter: url(#smoke-texture-1) blur(20px);
      animation: moveLight 8s infinite ease-in-out;
    }

    @keyframes moveDark {
      0% { transform: scale(1) translate(0, 0); }
      50% { transform: scale(1.05) translate(-2%, 2%); }
      100% { transform: scale(1) translate(0, 0); }
    }

    @keyframes moveGray {
      0% { transform: scale(1.02) translate(0, 0) rotate(0deg); }
      50% { transform: scale(1.09) translate(3%, -2%) rotate(2deg); }
      100% { transform: scale(1.02) translate(0, 0) rotate(0deg); }
    }

    @keyframes moveLight {
      0% { transform: scale(1) translate(0, 0); }
      50% { transform: scale(1.06) translate(-1%, -1%); }
      100% { transform: scale(1) translate(0, 0); }
    }

    /* 안내 메시지 */
    #start-notice {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-family: sans-serif;
      font-size: 18px;
      font-weight: bold;
      background: rgba(0, 0, 0, 0.85);
      padding: 16px 28px;
      border-radius: 30px;
      z-index: 10;
      text-align: center;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <video id="webcam-video" autoplay playsinline muted></video>

  <!-- 실시간 회색 연기 전용 난류 필터 -->
  <svg style="display:none;">
    <filter id="smoke-texture-1">
      <feTurbulence id="turbulence-1" type="fractalNoise" baseFrequency="0.012 0.018" numOctaves="4" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="55" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <filter id="smoke-texture-gray">
      <feTurbulence id="turbulence-gray" type="fractalNoise" baseFrequency="0.018 0.025" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="65" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>

  <!-- 3중 입체 농연 레이어 -->
  <div id="smoke-container">
    <div class="smoke-layer-dark"></div>
    <div class="smoke-layer-gray"></div>
    <div class="smoke-layer-light"></div>
  </div>

  <div id="start-notice">화면을 터치하여 체험을 시작하세요</div>

  <script>
    const video = document.getElementById('webcam-video');
    const smokeContainer = document.getElementById('smoke-container');
    const startNotice = document.getElementById('start-notice');

    const turb1 = document.getElementById('turbulence-1');
    const turbGray = document.getElementById('turbulence-gray');

    let currentAccY = 9.8;
    let currentBeta = 0;
    let animateTime = 0;

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { exact: "environment" } },
          audio: false
        });
        video.srcObject = stream;
      } catch (err) {
        try {
          const fallbackStream = await navigator.mediaDevices.getUserMedia({
            video: true, audio: false
          });
          video.srcObject = fallbackStream;
        } catch (e) {
          alert("카메라 권한이 필요합니다.");
        }
      }
    }

    function updateSmokeEffect() {
      // 회색 연기가 더 유기적으로 일렁이도록 전용 애니메이션 추가
      animateTime += 0.0025;
      
      const freqX1 = 0.012 + Math.sin(animateTime) * 0.003;
      const freqY1 = 0.018 + Math.cos(animateTime * 1.5) * 0.003;
      turb1.setAttribute('baseFrequency', `${freqX1} ${freqY1}`);

      const freqXG = 0.018 + Math.cos(animateTime * 1.2) * 0.005;
      const freqYG = 0.025 + Math.sin(animateTime * 1.8) * 0.005;
      turbGray.setAttribute('baseFrequency', `${freqXG} ${freqYG}`);

      // 높이 및 각도 계산
      let heightScore = (currentAccY - 4) / 4.5;
      heightScore = Math.min(Math.max(heightScore, 0.0), 1.0);

      let lookUpScore = (currentBeta - 20) / 45;
      lookUpScore = Math.min(Math.max(lookUpScore, 0.0), 1.0);

      let finalScore = Math.max(heightScore, lookUpScore);

      let translateY = (1 - finalScore) * -45; 
      let opacity = 0.15 + (finalScore * 0.8);

      if (finalScore < 0.35) {
        translateY = -55;
        opacity = 0.1;
      }

      smokeContainer.style.transform = `translateY(${translateY}%)`;
      smokeContainer.style.opacity = opacity;

      requestAnimationFrame(updateSmokeEffect);
    }

    function handleMotion(event) {
      if (event.accelerationIncludingGravity) {
        currentAccY = Math.abs(event.accelerationIncludingGravity.y || 9.8);
      }
    }

    function handleOrientation(event) {
      if (event.beta !== null) {
        currentBeta = event.beta;
      }
    }

    async function initApp() {
      startNotice.style.display = 'none';
      await startCamera();

      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const orientPermission = await DeviceOrientationEvent.requestPermission();
          const motionPermission = await DeviceMotionEvent.requestPermission();
          if (orientPermission === 'granted' && motionPermission === 'granted') {
            window.addEventListener('devicemotion', handleMotion);
            window.addEventListener('deviceorientation', handleOrientation);
          }
        } catch (e) {
          console.error(e);
        }
      } else {
        window.addEventListener('devicemotion', handleMotion);
        window.addEventListener('deviceorientation', handleOrientation);
      }

      updateSmokeEffect();
    }

    window.addEventListener('click', initApp, { once: true });
    window.addEventListener('touchstart', initApp, { once: true });
  </script>
</body>
</html>
