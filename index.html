<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>소방안전 AR 농연 체험</title>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: black;
    }

    /* 1. 후면 카메라 배경 영상 */
    #webcam-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
    }

    /* 2. 천장 체류형 농연 컨테이너 */
    #smoke-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      pointer-events: none;
      opacity: 0.85;
      transition: opacity 0.2s ease, transform 0.2s ease;
      
      /* 천장(상단)은 짙고 바닥(하단)은 투명하게 비치는 수평 마스크 */
      mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,0.8) 40%, rgba(0,0,0,0) 85%);
      -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,0.8) 40%, rgba(0,0,0,0) 85%);
    }

    /* 연기 입자 레이어 1 (상단 체류 연기) */
    .smoke-layer-1 {
      position: absolute;
      top: -15%;
      left: -20%;
      width: 140vw;
      height: 100vh;
      background-image: url('https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/lava/cloud.png');
      background-size: cover;
      background-position: top center;
      filter: invert(1) brightness(0.12) contrast(1.8);
      mix-blend-mode: multiply;
      animation: ceilingSmoke1 14s infinite ease-in-out;
    }

    /* 연기 입자 레이어 2 (기류 흐름 연기) */
    .smoke-layer-2 {
      position: absolute;
      top: -10%;
      left: -20%;
      width: 140vw;
      height: 90vh;
      background-image: url('https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/lava/cloud.png');
      background-size: 80% 80%;
      background-position: top center;
      filter: invert(1) brightness(0.08) contrast(2.2);
      opacity: 0.7;
      animation: ceilingSmoke2 9s infinite linear;
    }

    /* 천장에서 연기가 넘실거리는 애니메이션 */
    @keyframes ceilingSmoke1 {
      0% { transform: scale(1) translate(0, 0); }
      50% { transform: scale(1.06) translate(-2%, -1%); }
      100% { transform: scale(1) translate(0, 0); }
    }

    @keyframes ceilingSmoke2 {
      0% { transform: scale(1.02) translate(0, 0); }
      50% { transform: scale(1.08) translate(2%, 2%); }
      100% { transform: scale(1.02) translate(0, 0); }
    }

    /* 안내 메시지 */
    #start-notice {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-family: sans-serif;
      font-size: 18px;
      font-weight: bold;
      background: rgba(0, 0, 0, 0.85);
      padding: 16px 28px;
      border-radius: 30px;
      z-index: 10;
      text-align: center;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <video id="webcam-video" autoplay playsinline muted></video>

  <!-- 천장 체류형 농연 레이어 -->
  <div id="smoke-container">
    <div class="smoke-layer-1"></div>
    <div class="smoke-layer-2"></div>
  </div>

  <div id="start-notice">화면을 터치하여 체험을 시작하세요</div>

  <script>
    const video = document.getElementById('webcam-video');
    const smokeContainer = document.getElementById('smoke-container');
    const startNotice = document.getElementById('start-notice');

    let currentAccY = 9.8;
    let currentBeta = 0;

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { exact: "environment" } },
          audio: false
        });
        video.srcObject = stream;
      } catch (err) {
        try {
          const fallbackStream = await navigator.mediaDevices.getUserMedia({
            video: true, audio: false
          });
          video.srcObject = fallbackStream;
        } catch (e) {
          alert("카메라 권한이 필요합니다.");
        }
      }
    }

    function updateSmokeEffect() {
      // 1. 높이 및 시선 계산
      let heightScore = (currentAccY - 3) / 6;
      heightScore = Math.min(Math.max(heightScore, 0.0), 1.0);

      let lookUpScore = Math.abs(currentBeta) / 60;
      lookUpScore = Math.min(Math.max(lookUpScore, 0.0), 1.0);

      let finalScore = Math.max(heightScore, lookUpScore);

      // 2. 고개를 들거나 서 있을 때: 연기가 화면 아래로 내려오면서 전체를 가림
      // 숙이고 바닥을 볼 때: 연기 레이어가 위로 이동하며 아래쪽 시야가 훤히 트임
      let translateY = (1 - finalScore) * -35; // 위로 밀려나는 위치값 (%)
      let opacity = 0.35 + (finalScore * 0.55); // 농도 조절

      if (heightScore < 0.15 && lookUpScore < 0.15) {
        // 완전 숙였을 때는 상단에만 살짝 연기 층만 남고 바닥은 완전 맑음
        translateY = -50;
        opacity = 0.2;
      }

      smokeContainer.style.transform = `translateY(${translateY}%)`;
      smokeContainer.style.opacity = opacity;

      requestAnimationFrame(updateSmokeEffect);
    }

    function handleMotion(event) {
      if (event.accelerationIncludingGravity) {
        currentAccY = Math.abs(event.accelerationIncludingGravity.y || 9.8);
      }
    }

    function handleOrientation(event) {
      if (event.beta !== null) {
        currentBeta = event.beta;
      }
    }

    async function initApp() {
      startNotice.style.display = 'none';
      await startCamera();

      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const orientPermission = await DeviceOrientationEvent.requestPermission();
          const motionPermission = await DeviceMotionEvent.requestPermission();
          if (orientPermission === 'granted' && motionPermission === 'granted') {
            window.addEventListener('devicemotion', handleMotion);
            window.addEventListener('deviceorientation', handleOrientation);
          }
        } catch (e) {
          console.error(e);
        }
      } else {
        window.addEventListener('devicemotion', handleMotion);
        window.addEventListener('deviceorientation', handleOrientation);
      }

      updateSmokeEffect();
    }

    window.addEventListener('click', initApp, { once: true });
    window.addEventListener('touchstart', initApp, { once: true });
  </script>
</body>
</html>
