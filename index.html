<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>소방안전 AR 농연 체험</title>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: black;
    }

    /* 1. 실제 후면 카메라 영상 */
    #webcam-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
    }

    /* 2. 입체 연기 컨테이너 (중앙은 조금 더 뚫려 보이는 마스크 적용) */
    #smoke-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      pointer-events: none;
      opacity: 0.7; /* 초기 상태 */
      transition: opacity 0.25s ease;
      /* 화면 중심부는 연기가 살짝 옅어져 사물 식별이 가능하도록 설정 */
      mask-image: radial-gradient(circle at center, rgba(0,0,0,0.6) 0%, rgba(0,0,0,1) 80%);
      -webkit-mask-image: radial-gradient(circle at center, rgba(0,0,0,0.6) 0%, rgba(0,0,0,1) 80%);
    }

    /* 연기 레이어 1: 큰 덩어리의 베이스 연기 */
    .smoke-layer-1 {
      position: absolute;
      top: -20%;
      left: -20%;
      width: 140vw;
      height: 140vh;
      background-image: url('https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/lava/cloud.png');
      background-size: cover;
      background-position: center;
      /* 카메라 화면과 자연스럽게 겹치도록 필터 및 합성 방식 변경 */
      filter: invert(1) brightness(0.2) contrast(1.3);
      mix-blend-mode: multiply;
      opacity: 0.8;
      animation: smokeMove1 16s infinite ease-in-out;
    }

    /* 연기 레이어 2: 세밀하게 일렁이는 입자 연기 */
    .smoke-layer-2 {
      position: absolute;
      top: -20%;
      left: -20%;
      width: 140vw;
      height: 140vh;
      background-image: url('https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/lava/cloud.png');
      background-size: 70% 70%;
      background-position: center;
      filter: invert(1) brightness(0.15) contrast(1.6);
      mix-blend-mode: darken;
      opacity: 0.6;
      animation: smokeMove2 10s infinite linear;
    }

    /* 유기적인 움직임 애니메이션 */
    @keyframes smokeMove1 {
      0% { transform: rotate(0deg) scale(1) translate(0, 0); }
      50% { transform: rotate(4deg) scale(1.08) translate(-2%, -2%); }
      100% { transform: rotate(0deg) scale(1) translate(0, 0); }
    }

    @keyframes smokeMove2 {
      0% { transform: rotate(0deg) scale(1.02) translate(0, 0); }
      50% { transform: rotate(-6deg) scale(1.1) translate(2%, 1%); }
      100% { transform: rotate(0deg) scale(1.02) translate(0, 0); }
    }

    /* 터치 안내문 */
    #start-notice {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-family: sans-serif;
      font-size: 18px;
      font-weight: bold;
      background: rgba(0, 0, 0, 0.85);
      padding: 16px 28px;
      border-radius: 30px;
      z-index: 10;
      text-align: center;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <video id="webcam-video" autoplay playsinline muted></video>

  <!-- 투명도가 개선된 농연 레이어 -->
  <div id="smoke-container">
    <div class="smoke-layer-1"></div>
    <div class="smoke-layer-2"></div>
  </div>

  <div id="start-notice">화면을 터치하여 체험을 시작하세요</div>

  <script>
    const video = document.getElementById('webcam-video');
    const smokeContainer = document.getElementById('smoke-container');
    const startNotice = document.getElementById('start-notice');

    let currentAccY = 9.8;
    let currentBeta = 0;

    // 1. 후면 카메라 켜기
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { exact: "environment" } },
          audio: false
        });
        video.srcObject = stream;
      } catch (err) {
        try {
          const fallbackStream = await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: false
          });
          video.srcObject = fallbackStream;
        } catch (e) {
          alert("카메라 권한이 필요합니다.");
        }
      }
    }

    // 2. 실시간 연기 투명도 수치 연산
    function updateSmokeOpacity() {
      // 높이 점수 (서 있으면 1.0 / 숙이면 0.0)
      let heightScore = (currentAccY - 3) / 6;
      heightScore = Math.min(Math.max(heightScore, 0.0), 1.0);

      // 시선 각도 점수 (위를 볼수록 높아짐)
      let lookUpScore = Math.abs(currentBeta) / 60;
      lookUpScore = Math.min(Math.max(lookUpScore, 0.0), 1.0);

      // 서 있거나 위를 바라볼 때 최고 농도 적용
      let finalScore = Math.max(heightScore, lookUpScore);

      // [핵심] 최대 불투명도를 0.65로 제한하여 사물이 어렴풋이 보이도록 설정
      let finalOpacity = finalScore * 0.65;

      // 완전 숙였을 때는 연기가 스르륵 사라짐
      if (heightScore < 0.15 && lookUpScore < 0.15) {
        finalOpacity = 0.0;
      }

      smokeContainer.style.opacity = finalOpacity;

      requestAnimationFrame(updateSmokeOpacity);
    }

    function handleMotion(event) {
      if (event.accelerationIncludingGravity) {
        currentAccY = Math.abs(event.accelerationIncludingGravity.y || 9.8);
      }
    }

    function handleOrientation(event) {
      if (event.beta !== null) {
        currentBeta = event.beta;
      }
    }

    // 3. 앱 초기화
    async function initApp() {
      startNotice.style.display = 'none';
      await startCamera();

      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const orientPermission = await DeviceOrientationEvent.requestPermission();
          const motionPermission = await DeviceMotionEvent.requestPermission();
          if (orientPermission === 'granted' && motionPermission === 'granted') {
            window.addEventListener('devicemotion', handleMotion);
            window.addEventListener('deviceorientation', handleOrientation);
          }
        } catch (e) {
          console.error(e);
        }
      } else {
        window.addEventListener('devicemotion', handleMotion);
        window.addEventListener('deviceorientation', handleOrientation);
      }

      updateSmokeOpacity();
    }

    window.addEventListener('click', initApp, { once: true });
    window.addEventListener('touchstart', initApp, { once: true });
  </script>
</body>
</html>
