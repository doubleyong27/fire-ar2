<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>소방안전 AR 농연 체험</title>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: black;
    }

    /* 1. 후면 카메라 배경 영상 */
    #webcam-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
    }

    /* 2. 균일하고 부드러운 천장 농연 컨테이너 */
    #smoke-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      pointer-events: none;
      opacity: 0.85;
      transition: opacity 0.3s ease, transform 0.3s ease;
      
      /* 상단은 짙고 하단으로 갈수록 자연스럽게 흩어지는 그라데이션 */
      mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,0.7) 45%, rgba(0,0,0,0) 85%);
      -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,0.7) 45%, rgba(0,0,0,0) 85%);
    }

    /* 연기 레이어 1: 부드럽게 퍼지는 메인 베이스 연기 */
    .smoke-layer-1 {
      position: absolute;
      top: -30%;
      left: -30%;
      width: 160vw;
      height: 120vh;
      background-image: url('https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/lava/cloud.png');
      background-size: 180% 180%; /* 스케일을 크게 늘려 얼룩 자국 제거 */
      background-position: center;
      /* 블러(blur)를 주어 얼룩덜룩한 경계를 매끄럽게 뭉갬 */
      filter: invert(1) brightness(0.18) contrast(1.1) blur(10px);
      mix-blend-mode: multiply;
      animation: smoothSmoke1 20s infinite ease-in-out;
    }

    /* 연기 레이어 2: 은은하게 움직이는 하부 보조 연기 */
    .smoke-layer-2 {
      position: absolute;
      top: -20%;
      left: -20%;
      width: 140vw;
      height: 110vh;
      background-image: url('https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/lava/cloud.png');
      background-size: 140% 140%;
      background-position: top center;
      filter: invert(1) brightness(0.12) contrast(1.2) blur(15px);
      opacity: 0.75;
      animation: smoothSmoke2 14s infinite ease-in-out;
    }

    /* 얼룩 없이 부드럽게 넘실거리는 애니메이션 */
    @keyframes smoothSmoke1 {
      0% { transform: scale(1) translate(0, 0); }
      50% { transform: scale(1.05) translate(-2%, 1%); }
      100% { transform: scale(1) translate(0, 0); }
    }

    @keyframes smoothSmoke2 {
      0% { transform: scale(1.02) translate(0, 0); }
      50% { transform: scale(1.07) translate(2%, -1%); }
      100% { transform: scale(1.02) translate(0, 0); }
    }

    /* 안내 메시지 */
    #start-notice {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-family: sans-serif;
      font-size: 18px;
      font-weight: bold;
      background: rgba(0, 0, 0, 0.85);
      padding: 16px 28px;
      border-radius: 30px;
      z-index: 10;
      text-align: center;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <video id="webcam-video" autoplay playsinline muted></video>

  <!-- 얼룩 없이 균일하게 퍼지는 천장 농연 레이어 -->
  <div id="smoke-container">
    <div class="smoke-layer-1"></div>
    <div class="smoke-layer-2"></div>
  </div>

  <div id="start-notice">화면을 터치하여 체험을 시작하세요</div>

  <script>
    const video = document.getElementById('webcam-video');
    const smokeContainer = document.getElementById('smoke-container');
    const startNotice = document.getElementById('start-notice');

    let currentAccY = 9.8;
    let currentBeta = 0;

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { exact: "environment" } },
          audio: false
        });
        video.srcObject = stream;
      } catch (err) {
        try {
          const fallbackStream = await navigator.mediaDevices.getUserMedia({
            video: true, audio: false
          });
          video.srcObject = fallbackStream;
        } catch (e) {
          alert("카메라 권한이 필요합니다.");
        }
      }
    }

    function updateSmokeEffect() {
      let heightScore = (currentAccY - 3) / 6;
      heightScore = Math.min(Math.max(heightScore, 0.0), 1.0);

      let lookUpScore = Math.abs(currentBeta) / 60;
      lookUpScore = Math.min(Math.max(lookUpScore, 0.0), 1.0);

      let finalScore = Math.max(heightScore, lookUpScore);

      let translateY = (1 - finalScore) * -35; 
      let opacity = 0.3 + (finalScore * 0.6); 

      if (heightScore < 0.15 && lookUpScore < 0.15) {
        translateY = -50;
        opacity = 0.15;
      }

      smokeContainer.style.transform = `translateY(${translateY}%)`;
      smokeContainer.style.opacity = opacity;

      requestAnimationFrame(updateSmokeEffect);
    }

    function handleMotion(event) {
      if (event.accelerationIncludingGravity) {
        currentAccY = Math.abs(event.accelerationIncludingGravity.y || 9.8);
      }
    }

    function handleOrientation(event) {
      if (event.beta !== null) {
        currentBeta = event.beta;
      }
    }

    async function initApp() {
      startNotice.style.display = 'none';
      await startCamera();

      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const orientPermission = await DeviceOrientationEvent.requestPermission();
          const motionPermission = await DeviceMotionEvent.requestPermission();
          if (orientPermission === 'granted' && motionPermission === 'granted') {
            window.addEventListener('devicemotion', handleMotion);
            window.addEventListener('deviceorientation', handleOrientation);
          }
        } catch (e) {
          console.error(e);
        }
      } else {
        window.addEventListener('devicemotion', handleMotion);
        window.addEventListener('deviceorientation', handleOrientation);
      }

      updateSmokeEffect();
    }

    window.addEventListener('click', initApp, { once: true });
    window.addEventListener('touchstart', initApp, { once: true });
  </script>
</body>
</html>
