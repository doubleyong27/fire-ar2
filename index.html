<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>소방안전 AR 농연 체험</title>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: black;
    }

    /* 1. 실제 후면 카메라 영상 */
    #webcam-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
    }

    /* 연기 레이어 공통 컨테이너 */
    #smoke-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      pointer-events: none;
      opacity: 0.9; /* 초기 상태: 자욱함 */
      transition: opacity 0.3s ease;
    }

    /* 연기 레이어 1: 큰 입자의 느린 배경 연기 */
    .smoke-layer-1 {
      position: absolute;
      top: -20%;
      left: -20%;
      width: 140vw;
      height: 140vh;
      background-image: url('https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/lava/cloud.png');
      background-size: cover;
      background-position: center;
      filter: invert(1) brightness(0.12) contrast(2.0);
      mix-blend-mode: multiply;
      animation: smokeRotate1 18s infinite ease-in-out;
    }

    /* 연기 레이어 2: 세밀한 입자의 빠른 전면 연기 */
    .smoke-layer-2 {
      position: absolute;
      top: -20%;
      left: -20%;
      width: 140vw;
      height: 140vh;
      background-image: url('https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/lava/cloud.png');
      background-size: 80% 80%;
      background-position: center;
      filter: invert(1) brightness(0.08) contrast(2.5);
      opacity: 0.85;
      animation: smokeRotate2 12s infinite linear;
    }

    /* 농연 뭉게구름 애니메이션 */
    @keyframes smokeRotate1 {
      0% { transform: rotate(0deg) scale(1) translate(0, 0); }
      50% { transform: rotate(5deg) scale(1.1) translate(-3%, -2%); }
      100% { transform: rotate(0deg) scale(1) translate(0, 0); }
    }

    @keyframes smokeRotate2 {
      0% { transform: rotate(0deg) scale(1.05) translate(0, 0); }
      50% { transform: rotate(-8deg) scale(1.15) translate(2%, 3%); }
      100% { transform: rotate(0deg) scale(1.05) translate(0, 0); }
    }

    /* 화면 터치 안내문 */
    #start-notice {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-family: sans-serif;
      font-size: 18px;
      font-weight: bold;
      background: rgba(0, 0, 0, 0.85);
      padding: 16px 28px;
      border-radius: 30px;
      z-index: 10;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      pointer-events: none;
    }
  </style>
</head>

<body>

  <video id="webcam-video" autoplay playsinline muted></video>

  <!-- 듀얼 입자 리얼 농연 컨테이너 -->
  <div id="smoke-container">
    <div class="smoke-layer-1"></div>
    <div class="smoke-layer-2"></div>
  </div>

  <div id="start-notice">화면을 터치하여 농연 체험을 시작하세요</div>

  <script>
    const video = document.getElementById('webcam-video');
    const smokeContainer = document.getElementById('smoke-container');
    const startNotice = document.getElementById('start-notice');

    let currentAccY = 9.8;
    let currentBeta = 0;

    // 1. 카메라 시작
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { exact: "environment" } },
          audio: false
        });
        video.srcObject = stream;
      } catch (err) {
        try {
          const fallbackStream = await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: false
          });
          video.srcObject = fallbackStream;
        } catch (e) {
          alert("카메라 접근 권한이 필요합니다.");
        }
      }
    }

    // 2. 투명도 실시간 연산
    function updateSmokeOpacity() {
      // 높이 점수 (accY 9.8 근처 -> 1.0 / 3.0 이하 -> 0.0)
      let heightScore = (currentAccY - 3) / 6;
      heightScore = Math.min(Math.max(heightScore, 0.0), 1.0);

      // 시선 기울기 점수
      let lookUpScore = Math.abs(currentBeta) / 60;
      lookUpScore = Math.min(Math.max(lookUpScore, 0.0), 1.0);

      // 최종 연기 농도
      let finalOpacity = Math.max(heightScore, lookUpScore) * 0.92;

      // 낮게 숙이고 바닥을 보면 연기가 완전히 개어짐
      if (heightScore < 0.2 && lookUpScore < 0.2) {
        finalOpacity = 0.0;
      }

      smokeContainer.style.opacity = finalOpacity;

      requestAnimationFrame(updateSmokeOpacity);
    }

    function handleMotion(event) {
      if (event.accelerationIncludingGravity) {
        currentAccY = Math.abs(event.accelerationIncludingGravity.y || 9.8);
      }
    }

    function handleOrientation(event) {
      if (event.beta !== null) {
        currentBeta = event.beta;
      }
    }

    // 3. 앱 초기화
    async function initApp() {
      startNotice.style.display = 'none';
      await startCamera();

      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const orientPermission = await DeviceOrientationEvent.requestPermission();
          const motionPermission = await DeviceMotionEvent.requestPermission();
          if (orientPermission === 'granted' && motionPermission === 'granted') {
            window.addEventListener('devicemotion', handleMotion);
            window.addEventListener('deviceorientation', handleOrientation);
          }
        } catch (e) {
          console.error(e);
        }
      } else {
        window.addEventListener('devicemotion', handleMotion);
        window.addEventListener('deviceorientation', handleOrientation);
      }

      updateSmokeOpacity();
    }

    window.addEventListener('click', initApp, { once: true });
    window.addEventListener('touchstart', initApp, { once: true });
  </script>
</body>
</html>
