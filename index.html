<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>소방안전 AR 농연 체험</title>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: black;
    }

    /* 1. 후면 카메라 배경 영상 */
    #webcam-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
    }

    /* 2. 입체 연기 컨테이너 */
    #smoke-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      pointer-events: none;
      opacity: 0.95;
      /* 자연스러운 각도 추적을 위해 프레임 단위 매끄러운 전환 */
      transition: opacity 0.15s ease-out, transform 0.15s ease-out;
      
      mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,0.9) 45%, rgba(0,0,0,0) 85%);
      -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,0.9) 45%, rgba(0,0,0,0) 85%);
    }

    /* 레이어 1: 천장 심부 짙은 흑연 */
    .smoke-layer-dark {
      position: absolute;
      top: -35%;
      left: -25%;
      width: 150vw;
      height: 130vh;
      background: radial-gradient(circle at 50% 30%, rgba(5, 5, 5, 0.99) 0%, rgba(2, 2, 2, 0.90) 50%, transparent 80%);
      filter: url(#smoke-texture-1) blur(8px);
      animation: moveDark 18s infinite ease-in-out;
    }

    /* 레이어 2: 짙고 빽빽해진 진한 회색 농연 */
    .smoke-layer-gray {
      position: absolute;
      top: -25%;
      left: -20%;
      width: 140vw;
      height: 125vh;
      /* 농도를 대폭 올린 짙은 회색 톤 적용 */
      background: radial-gradient(circle at 45% 35%, rgba(160, 155, 150, 0.92) 0%, rgba(80, 75, 70, 0.75) 45%, transparent 80%);
      filter: url(#smoke-texture-gray) blur(10px);
      mix-blend-mode: screen;
      animation: moveGray 11s infinite ease-in-out;
    }

    /* 레이어 3: 하부 유동 연기 */
    .smoke-layer-light {
      position: absolute;
      top: -15%;
      left: -10%;
      width: 125vw;
      height: 110vh;
      background: radial-gradient(circle at 55% 25%, rgba(110, 110, 110, 0.7) 0%, rgba(40, 40, 40, 0.5) 50%, transparent 75%);
      filter: url(#smoke-texture-1) blur(16px);
      animation: moveLight 8s infinite ease-in-out;
    }

    @keyframes moveDark {
      0% { transform: scale(1) translate(0, 0); }
      50% { transform: scale(1.05) translate(-2%, 2%); }
      100% { transform: scale(1) translate(0, 0); }
    }

    @keyframes moveGray {
      0% { transform: scale(1.02) translate(0, 0) rotate(0deg); }
      50% { transform: scale(1.09) translate(3%, -2%) rotate(2deg); }
      100% { transform: scale(1.02) translate(0, 0) rotate(0deg); }
    }

    @keyframes moveLight {
      0% { transform: scale(1) translate(0, 0); }
      50% { transform: scale(1.06) translate(-1%, -1%); }
      100% { transform: scale(1) translate(0, 0); }
    }

    /* 안내 메시지 */
    #start-notice {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-family: sans-serif;
      font-size: 18px;
      font-weight: bold;
      background: rgba(0, 0, 0, 0.85);
      padding: 16px 28px;
      border-radius: 30px;
      z-index: 10;
      text-align: center;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <video id="webcam-video" autoplay playsinline muted></video>

  <!-- 실시간 회색 연기 전용 난류 필터 -->
  <svg style="display:none;">
    <filter id="smoke-texture-1">
      <feTurbulence id="turbulence-1" type="fractalNoise" baseFrequency="0.012 0.018" numOctaves="4" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="55" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <filter id="smoke-texture-gray">
      <feTurbulence id="turbulence-gray" type="fractalNoise" baseFrequency="0.02 0.028" numOctaves="4" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="75" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>

  <!-- 3중 입체 농연 레이어 -->
  <div id="smoke-container">
    <div class="smoke-layer-dark"></div>
    <div class="smoke-layer-gray"></div>
    <div class="smoke-layer-light"></div>
  </div>

  <div id="start-notice">화면을 터치하여 체험을 시작하세요</div>

  <script>
    const video = document.getElementById('webcam-video');
    const smokeContainer = document.getElementById('smoke-container');
    const startNotice = document.getElementById('start-notice');

    const turb1 = document.getElementById('turbulence-1');
    const turbGray = document.getElementById('turbulence-gray');

    let currentBeta = 90;
    let animateTime = 0;

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { exact: "environment" } },
          audio: false
        });
        video.srcObject = stream;
      } catch (err) {
        try {
          const fallbackStream = await navigator.mediaDevices.getUserMedia({
            video: true, audio: false
          });
          video.srcObject = fallbackStream;
        } catch (e) {
          alert("카메라 권한이 필요합니다.");
        }
      }
    }

    function updateSmokeEffect() {
      // 실시간 기류 일렁임
      animateTime += 0.0025;
      
      const freqX1 = 0.012 + Math.sin(animateTime) * 0.003;
      const freqY1 = 0.018 + Math.cos(animateTime * 1.5) * 0.003;
      turb1.setAttribute('baseFrequency', `${freqX1} ${freqY1}`);

      const freqXG = 0.02 + Math.cos(animateTime * 1.2) * 0.005;
      const freqYG = 0.028 + Math.sin(animateTime * 1.8) * 0.005;
      turbGray.setAttribute('baseFrequency', `${freqXG} ${freqYG}`);

      // 각도 추적 비율 계산 (currentBeta: 90도 수직, 0도 바닥)
      // 85도(직립) ~ 25도(숙임) 범위 내에서 매끄럽게 선형 변화
      let progress = (85 - currentBeta) / 60;
      progress = Math.min(Math.max(progress, 0.0), 1.0);

      // 1. 위치 변화: 고개를 숙일수록(progress 증가) 연기가 위로 이동 (-48%까지)
      let translateY = progress * -48; 

      // 2. 투명도 완화: 연기가 완전히 사라지지 않고 최소 0.28(28%) 농도를 유지함
      let opacity = 0.95 - (progress * 0.67); 

      smokeContainer.style.transform = `translateY(${translateY}%)`;
      smokeContainer.style.opacity = opacity;

      requestAnimationFrame(updateSmokeEffect);
    }

    function handleOrientation(event) {
      if (event.beta !== null) {
        currentBeta = Math.abs(event.beta);
      }
    }

    async function initApp() {
      startNotice.style.display = 'none';
      await startCamera();

      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const orientPermission = await DeviceOrientationEvent.requestPermission();
          if (orientPermission === 'granted') {
            window.addEventListener('deviceorientation', handleOrientation);
          }
        } catch (e) {
          console.error(e);
        }
      } else {
        window.addEventListener('deviceorientation', handleOrientation);
      }

      updateSmokeEffect();
    }

    window.addEventListener('click', initApp, { once: true });
    window.addEventListener('touchstart', initApp, { once: true });
  </script>
</body>
</html>
