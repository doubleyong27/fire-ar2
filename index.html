<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>소방안전 AR 농연 체험</title>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: black;
    }

    /* 1. 후면 카메라 배경 영상 */
    #webcam-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
    }

    /* 2. 입체 연기 컨테이너 */
    #smoke-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      pointer-events: none;
      opacity: 0.95;
      transition: opacity 0.2s cubic-bezier(0.25, 1, 0.5, 1), transform 0.2s cubic-bezier(0.25, 1, 0.5, 1);
      
      mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,0.9) 50%, rgba(0,0,0,0) 90%);
      -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,0.9) 50%, rgba(0,0,0,0) 90%);
    }

    /* 레이어 1: 1.5m용 암전 흑연 */
    .smoke-layer-dark {
      position: absolute;
      top: -30%;
      left: -25%;
      width: 150vw;
      height: 140vh;
      background: radial-gradient(circle at 50% 40%, rgba(5, 5, 5, 0.99) 0%, rgba(2, 2, 2, 0.92) 50%, transparent 85%);
      filter: url(#smoke-texture-1) blur(8px);
      animation: moveDark 18s infinite ease-in-out;
    }

    /* 레이어 2: 회색/연갈색 일렁이는 농연 */
    .smoke-layer-gray {
      position: absolute;
      top: -20%;
      left: -20%;
      width: 140vw;
      height: 130vh;
      background: radial-gradient(circle at 45% 40%, rgba(130, 125, 120, 0.85) 0%, rgba(50, 48, 45, 0.65) 45%, transparent 80%);
      filter: url(#smoke-texture-gray) blur(12px);
      mix-blend-mode: screen;
      animation: moveGray 11s infinite ease-in-out;
    }

    /* 레이어 3: 하부 이동 연기 */
    .smoke-layer-light {
      position: absolute;
      top: -10%;
      left: -10%;
      width: 125vw;
      height: 120vh;
      background: radial-gradient(circle at 55% 30%, rgba(90, 90, 90, 0.6) 0%, rgba(20, 20, 20, 0.4) 50%, transparent 75%);
      filter: url(#smoke-texture-1) blur(16px);
      animation: moveLight 8s infinite ease-in-out;
    }

    @keyframes moveDark {
      0% { transform: scale(1) translate(0, 0); }
      50% { transform: scale(1.05) translate(-2%, 2%); }
      100% { transform: scale(1) translate(0, 0); }
    }

    @keyframes moveGray {
      0% { transform: scale(1.02) translate(0, 0) rotate(0deg); }
      50% { transform: scale(1.09) translate(3%, -2%) rotate(2deg); }
      100% { transform: scale(1.02) translate(0, 0) rotate(0deg); }
    }

    @keyframes moveLight {
      0% { transform: scale(1) translate(0, 0); }
      50% { transform: scale(1.06) translate(-1%, -1%); }
      100% { transform: scale(1) translate(0, 0); }
    }

    /* 3. 높이/자세 상태 표시 바 */
    #status-bar {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.85);
      color: #ff4444;
      border: 1px solid #ff4444;
      padding: 8px 18px;
      border-radius: 20px;
      font-family: sans-serif;
      font-size: 14px;
      font-weight: bold;
      z-index: 5;
      pointer-events: none;
      transition: all 0.3s ease;
    }

    /* 안내 메시지 */
    #start-notice {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-family: sans-serif;
      font-size: 18px;
      font-weight: bold;
      background: rgba(0, 0, 0, 0.85);
      padding: 16px 28px;
      border-radius: 30px;
      z-index: 10;
      text-align: center;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <video id="webcam-video" autoplay playsinline muted></video>

  <!-- 실시간 연기 난류 필터 -->
  <svg style="display:none;">
    <filter id="smoke-texture-1">
      <feTurbulence id="turbulence-1" type="fractalNoise" baseFrequency="0.012 0.018" numOctaves="4" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="55" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <filter id="smoke-texture-gray">
      <feTurbulence id="turbulence-gray" type="fractalNoise" baseFrequency="0.018 0.025" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="65" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>

  <!-- 3중 입체 농연 레이어 -->
  <div id="smoke-container">
    <div class="smoke-layer-dark"></div>
    <div class="smoke-layer-gray"></div>
    <div class="smoke-layer-light"></div>
  </div>

  <div id="status-bar">자세 감지 준비 중...</div>
  <div id="start-notice">화면을 터치하여 체험을 시작하세요</div>

  <script>
    const video = document.getElementById('webcam-video');
    const smokeContainer = document.getElementById('smoke-container');
    const startNotice = document.getElementById('start-notice');
    const statusBar = document.getElementById('status-bar');

    const turb1 = document.getElementById('turbulence-1');
    const turbGray = document.getElementById('turbulence-gray');

    let currentAccY = 9.8;
    let currentBeta = 90;
    let animateTime = 0;

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { exact: "environment" } },
          audio: false
        });
        video.srcObject = stream;
      } catch (err) {
        try {
          const fallbackStream = await navigator.mediaDevices.getUserMedia({
            video: true, audio: false
          });
          video.srcObject = fallbackStream;
        } catch (e) {
          alert("카메라 권한이 필요합니다.");
        }
      }
    }

    function updateSmokeEffect() {
      // 실시간 기류 애니메이션
      animateTime += 0.0025;
      const freqX1 = 0.012 + Math.sin(animateTime) * 0.003;
      const freqY1 = 0.018 + Math.cos(animateTime * 1.5) * 0.003;
      turb1.setAttribute('baseFrequency', `${freqX1} ${freqY1}`);

      const freqXG = 0.018 + Math.cos(animateTime * 1.2) * 0.005;
      const freqYG = 0.025 + Math.sin(animateTime * 1.8) * 0.005;
      turbGray.setAttribute('baseFrequency', `${freqXG} ${freqYG}`);

      // 감도 대폭 보정: 정면 수직(90도) 대비 조금만 숙여도(55도 이하) 숙인 자세로 판단
      // beta 수치: 90도(완전 직립 정면), 0도(완전 평평 바닥)
      
      let translateY = 0;
      let opacity = 0.96;

      if (currentBeta > 65 && currentAccY > 7.5) {
        // [1.5m 높이 - 직립 자세]: 연기가 거의 전체를 덮어 앞이 보이지 않음
        translateY = 15; // 연기 레이어를 바닥 쪽으로 끌어내림
        opacity = 0.96;  // 시야 96% 차단

        statusBar.innerText = "🔴 약 1.5m 높이 (직립) - 농연으로 시야 차단됨";
        statusBar.style.color = "#ff4444";
        statusBar.style.borderColor = "#ff4444";
      } 
      else if (currentBeta > 40 && currentBeta <= 65) {
        // [1.2m 높이 - 중간 숙임 자세]: 연기가 조금 위로 올라가며 대피로 윤곽이 서서히 보임
        translateY = -25;
        opacity = 0.45;

        statusBar.innerText = "🟡 약 1.2m 높이 - 자세를 더 낮추세요";
        statusBar.style.color = "#ffcc00";
        statusBar.style.borderColor = "#ffcc00";
      } 
      else {
        // [1m 이하 - 대피 자세]: 고개를 조금만 더 숙여도 연기가 위로 쓸려 올라가 시야가 완전히 확보됨
        translateY = -65;
        opacity = 0.08;

        statusBar.innerText = "🟢 1m 이하 (대피 자세) - 시야 완전 확보";
        statusBar.style.color = "#00ffcc";
        statusBar.style.borderColor = "#00ffcc";
      }

      smokeContainer.style.transform = `translateY(${translateY}%)`;
      smokeContainer.style.opacity = opacity;

      requestAnimationFrame(updateSmokeEffect);
    }

    function handleMotion(event) {
      if (event.accelerationIncludingGravity) {
        currentAccY = Math.abs(event.accelerationIncludingGravity.y || 9.8);
      }
    }

    function handleOrientation(event) {
      if (event.beta !== null) {
        // beta 절대값 처리 (스마트폰 앞/뒤 기울기)
        currentBeta = Math.abs(event.beta);
      }
    }

    async function initApp() {
      startNotice.style.display = 'none';
      await startCamera();

      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const orientPermission = await DeviceOrientationEvent.requestPermission();
          const motionPermission = await DeviceMotionEvent.requestPermission();
          if (orientPermission === 'granted' && motionPermission === 'granted') {
            window.addEventListener('devicemotion', handleMotion);
            window.addEventListener('deviceorientation', handleOrientation);
          }
        } catch (e) {
          console.error(e);
        }
      } else {
        window.addEventListener('devicemotion', handleMotion);
        window.addEventListener('deviceorientation', handleOrientation);
      }

      updateSmokeEffect();
    }

    window.addEventListener('click', initApp, { once: true });
    window.addEventListener('touchstart', initApp, { once: true });
  </script>
</body>
</html>
