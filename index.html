<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>소방안전 AR 농연 체험</title>
  <!-- A-Frame 및 WebAR 카메라 라이브러리 -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">
  <!-- 아이폰 Safari 카메라 및 센서 자동 연동 -->
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
    <a-entity id="rig" position="0 1.6 0">
      <a-camera id="camera" look-controls></a-camera>
      
      <!-- 화면 가림 연기 오버레이 -->
      <a-plane id="smoke-overlay" 
               position="0 0 -0.5" 
               width="3" height="3" 
               color="#000000" 
               material="transparent: true; opacity: 0.8;">
      </a-plane>
    </a-entity>
  </a-scene>

  <script>
    const smokeOverlay = document.querySelector('#smoke-overlay');

    function handleMotion(event) {
      const accY = event.accelerationIncludingGravity.y; 
      if (accY !== null) {
        // 아이폰/안드로이드 센서 수치에 따른 투명도 반응
        let opacity = (accY - 2) / 7;
        opacity = Math.min(Math.max(opacity, 0.0), 0.85);
        smokeOverlay.setAttribute('material', 'opacity', opacity);
      }
    }

    // 아이폰 iOS 센서 권한 요청
    function requestMotionPermission() {
      if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        DeviceMotionEvent.requestPermission()
          .then(response => {
            if (response === 'granted') {
              window.addEventListener('devicemotion', handleMotion);
            }
          })
          .catch(console.error);
      } else {
        window.addEventListener('devicemotion', handleMotion);
      }
    }

    // 화면 터치 시 권한 요청 실행
    window.addEventListener('click', requestMotionPermission, { once: true });
    window.addEventListener('touchstart', requestMotionPermission, { once: true });
  </script>
</body>
</html>
