<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>소방안전 AR 농연 체험</title>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: black;
    }

    /* 1. 후면 카메라 배경 영상 */
    #webcam-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
    }

    /* 2. 입체 연기 컨테이너 */
    #smoke-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      pointer-events: none;
      opacity: 0.88;
      transition: opacity 0.3s cubic-bezier(0.25, 1, 0.5, 1), transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
      
      /* 상단 천장 집중 수평 마스크 */
      mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,0.85) 35%, rgba(0,0,0,0) 75%);
      -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,0.85) 35%, rgba(0,0,0,0) 75%);
    }

    /* 연기 레이어 1: 메인 농연 레이어 */
    .smoke-layer-1 {
      position: absolute;
      top: -35%;
      left: -25%;
      width: 150vw;
      height: 130vh;
      background: radial-gradient(circle at 50% 30%, rgba(12, 12, 12, 0.98) 0%, rgba(5, 5, 5, 0.85) 45%, transparent 75%);
      filter: url(#smoke-texture-1) blur(12px);
      animation: moveLayer1 16s infinite ease-in-out;
    }

    /* 연기 레이어 2: 유기적 기류 보조 레이어 */
    .smoke-layer-2 {
      position: absolute;
      top: -25%;
      left: -15%;
      width: 130vw;
      height: 115vh;
      background: radial-gradient(circle at 40% 25%, rgba(28, 28, 28, 0.9) 0%, rgba(10, 10, 10, 0.7) 50%, transparent 80%);
      filter: url(#smoke-texture-2) blur(18px);
      animation: moveLayer2 11s infinite ease-in-out;
    }

    /* 연기 레이어 3: 하부 미세 연기 레이어 */
    .smoke-layer-3 {
      position: absolute;
      top: -15%;
      left: -10%;
      width: 120vw;
      height: 100vh;
      background: radial-gradient(circle at 60% 20%, rgba(40, 40, 40, 0.6) 0%, rgba(15, 15, 15, 0.4) 40%, transparent 70%);
      filter: url(#smoke-texture-1) blur(22px);
      animation: moveLayer3 8s infinite ease-in-out;
    }

    @keyframes moveLayer1 {
      0% { transform: scale(1) translate(0, 0) rotate(0deg); }
      50% { transform: scale(1.05) translate(-2%, 2%) rotate(1deg); }
      100% { transform: scale(1) translate(0, 0) rotate(0deg); }
    }

    @keyframes moveLayer2 {
      0% { transform: scale(1.02) translate(0, 0) rotate(0deg); }
      50% { transform: scale(1.07) translate(2%, -1%) rotate(-1deg); }
      100% { transform: scale(1.02) translate(0, 0) rotate(0deg); }
    }

    @keyframes moveLayer3 {
      0% { transform: scale(1) translate(0, 0); }
      50% { transform: scale(1.04) translate(-1%, -1%); }
      100% { transform: scale(1) translate(0, 0); }
    }

    /* 안내 메시지 */
    #start-notice {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-family: sans-serif;
      font-size: 18px;
      font-weight: bold;
      background: rgba(0, 0, 0, 0.85);
      padding: 16px 28px;
      border-radius: 30px;
      z-index: 10;
      text-align: center;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <video id="webcam-video" autoplay playsinline muted></video>

  <!-- 동적 연기 난류 필터 생성기 -->
  <svg style="display:none;">
    <filter id="smoke-texture-1">
      <feTurbulence id="turbulence-1" type="fractalNoise" baseFrequency="0.012 0.018" numOctaves="4" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="55" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <filter id="smoke-texture-2">
      <feTurbulence id="turbulence-2" type="fractalNoise" baseFrequency="0.02 0.01" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="40" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>

  <!-- 실감 농연 레이어 -->
  <div id="smoke-container">
    <div class="smoke-layer-1"></div>
    <div class="smoke-layer-2"></div>
    <div class="smoke-layer-3"></div>
  </div>

  <div id="start-notice">화면을 터치하여 체험을 시작하세요</div>

  <script>
    const video = document.getElementById('webcam-video');
    const smokeContainer = document.getElementById('smoke-container');
    const startNotice = document.getElementById('start-notice');

    const turb1 = document.getElementById('turbulence-1');
    const turb2 = document.getElementById('turbulence-2');

    let currentAccY = 9.8;
    let currentBeta = 0;
    let animateTime = 0;

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { exact: "environment" } },
          audio: false
        });
        video.srcObject = stream;
      } catch (err) {
        try {
          const fallbackStream = await navigator.mediaDevices.getUserMedia({
            video: true, audio: false
          });
          video.srcObject = fallbackStream;
        } catch (e) {
          alert("카메라 권한이 필요합니다.");
        }
      }
    }

    function updateSmokeEffect() {
      // 1. 연기 난류(Turbulence) 실시간 애니메이션 (연기가 일렁이듯 움직이는 기류 연출)
      animateTime += 0.002;
      const freqX1 = 0.012 + Math.sin(animateTime) * 0.003;
      const freqY1 = 0.018 + Math.cos(animateTime * 1.5) * 0.003;
      turb1.setAttribute('baseFrequency', `${freqX1} ${freqY1}`);

      const freqX2 = 0.02 + Math.cos(animateTime * 0.8) * 0.004;
      const freqY2 = 0.01 + Math.sin(animateTime * 1.2) * 0.002;
      turb2.setAttribute('baseFrequency', `${freqX2} ${freqY2}`);

      // 2. 높이 점수 감도
      let heightScore = (currentAccY - 4) / 4.5;
      heightScore = Math.min(Math.max(heightScore, 0.0), 1.0);

      // 3. 시선 각도 감도
      let lookUpScore = (currentBeta - 20) / 45;
      lookUpScore = Math.min(Math.max(lookUpScore, 0.0), 1.0);

      let finalScore = Math.max(heightScore, lookUpScore);

      let translateY = (1 - finalScore) * -45; 
      let opacity = 0.1 + (finalScore * 0.82);

      if (finalScore < 0.35) {
        translateY = -55;
        opacity = 0.1;
      }

      smokeContainer.style.transform = `translateY(${translateY}%)`;
      smokeContainer.style.opacity = opacity;

      requestAnimationFrame(updateSmokeEffect);
    }

    function handleMotion(event) {
      if (event.accelerationIncludingGravity) {
        currentAccY = Math.abs(event.accelerationIncludingGravity.y || 9.8);
      }
    }

    function handleOrientation(event) {
      if (event.beta !== null) {
        currentBeta = event.beta;
      }
    }

    async function initApp() {
      startNotice.style.display = 'none';
      await startCamera();

      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const orientPermission = await DeviceOrientationEvent.requestPermission();
          const motionPermission = await DeviceMotionEvent.requestPermission();
          if (orientPermission === 'granted' && motionPermission === 'granted') {
            window.addEventListener('devicemotion', handleMotion);
            window.addEventListener('deviceorientation', handleOrientation);
          }
        } catch (e) {
          console.error(e);
        }
      } else {
        window.addEventListener('devicemotion', handleMotion);
        window.addEventListener('deviceorientation', handleOrientation);
      }

      updateSmokeEffect();
    }

    window.addEventListener('click', initApp, { once: true });
    window.addEventListener('touchstart', initApp, { once: true });
  </script>
</body>
</html>
