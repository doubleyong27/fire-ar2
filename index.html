<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>소방안전 AR 농연 체험</title>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: black;
    }

    /* 1. 후면 카메라 배경 영상 */
    #webcam-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
    }

    /* 2. 연기 질감이 더해진 그라데이션 컨테이너 */
    #smoke-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      pointer-events: none;
      opacity: 0.85;
      transition: opacity 0.3s cubic-bezier(0.25, 1, 0.5, 1), transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
      
      /* 천장은 자욱하고 아래는 뚫리는 경계 마스크 */
      mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,0.85) 35%, rgba(0,0,0,0) 75%);
      -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,0.85) 35%, rgba(0,0,0,0) 75%);
    }

    /* SVG 연기 질감 필터가 적용된 노이즈 레이어 1 */
    .smoke-layer-1 {
      position: absolute;
      top: -30%;
      left: -20%;
      width: 140vw;
      height: 120vh;
      background: radial-gradient(circle at 50% 30%, rgba(15, 15, 15, 0.95) 0%, rgba(5, 5, 5, 0.8) 50%, transparent 80%);
      filter: url(#smoke-texture) blur(18px);
      animation: smoothFlow1 12s infinite ease-in-out;
    }

    /* 보조 연기 레이어 2 */
    .smoke-layer-2 {
      position: absolute;
      top: -20%;
      left: -10%;
      width: 120vw;
      height: 110vh;
      background: radial-gradient(circle at 40% 20%, rgba(25, 25, 25, 0.9) 0%, rgba(10, 10, 10, 0.6) 45%, transparent 75%);
      filter: url(#smoke-texture) blur(24px);
      animation: smoothFlow2 9s infinite ease-in-out;
    }

    @keyframes smoothFlow1 {
      0% { transform: scale(1) translate(0, 0); }
      50% { transform: scale(1.06) translate(-2%, 2%); }
      100% { transform: scale(1) translate(0, 0); }
    }

    @keyframes smoothFlow2 {
      0% { transform: scale(1.02) translate(0, 0); }
      50% { transform: scale(1.08) translate(2%, -1%); }
      100% { transform: scale(1.02) translate(0, 0); }
    }

    /* 안내 메시지 */
    #start-notice {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-family: sans-serif;
      font-size: 18px;
      font-weight: bold;
      background: rgba(0, 0, 0, 0.85);
      padding: 16px 28px;
      border-radius: 30px;
      z-index: 10;
      text-align: center;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <video id="webcam-video" autoplay playsinline muted></video>

  <!-- 실시간 연기 입자 질감 생성기 (SVG 필터) -->
  <svg style="display:none;">
    <filter id="smoke-texture">
      <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="35" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>

  <!-- 질감이 가공된 농연 레이어 -->
  <div id="smoke-container">
    <div class="smoke-layer-1"></div>
    <div class="smoke-layer-2"></div>
  </div>

  <div id="start-notice">화면을 터치하여 체험을 시작하세요</div>

  <script>
    const video = document.getElementById('webcam-video');
    const smokeContainer = document.getElementById('smoke-container');
    const startNotice = document.getElementById('start-notice');

    let currentAccY = 9.8;
    let currentBeta = 0;

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { exact: "environment" } },
          audio: false
        });
        video.srcObject = stream;
      } catch (err) {
        try {
          const fallbackStream = await navigator.mediaDevices.getUserMedia({
            video: true, audio: false
          });
          video.srcObject = fallbackStream;
        } catch (e) {
          alert("카메라 권한이 필요합니다.");
        }
      }
    }

    function updateSmokeEffect() {
      // 1. 높이 점수 감도
      let heightScore = (currentAccY - 4) / 4.5;
      heightScore = Math.min(Math.max(heightScore, 0.0), 1.0);

      // 2. 시선 각도 감도 (정면 이하로 살짝만 내려가면 연기가 걷힘)
      let lookUpScore = (currentBeta - 20) / 45;
      lookUpScore = Math.min(Math.max(lookUpScore, 0.0), 1.0);

      let finalScore = Math.max(heightScore, lookUpScore);

      let translateY = (1 - finalScore) * -45; 
      let opacity = 0.1 + (finalScore * 0.8);

      if (finalScore < 0.35) {
        translateY = -55;
        opacity = 0.1;
      }

      smokeContainer.style.transform = `translateY(${translateY}%)`;
      smokeContainer.style.opacity = opacity;

      requestAnimationFrame(updateSmokeEffect);
    }

    function handleMotion(event) {
      if (event.accelerationIncludingGravity) {
        currentAccY = Math.abs(event.accelerationIncludingGravity.y || 9.8);
      }
    }

    function handleOrientation(event) {
      if (event.beta !== null) {
        currentBeta = event.beta;
      }
    }

    async function initApp() {
      startNotice.style.display = 'none';
      await startCamera();

      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const orientPermission = await DeviceOrientationEvent.requestPermission();
          const motionPermission = await DeviceMotionEvent.requestPermission();
          if (orientPermission === 'granted' && motionPermission === 'granted') {
            window.addEventListener('devicemotion', handleMotion);
            window.addEventListener('deviceorientation', handleOrientation);
          }
        } catch (e) {
          console.error(e);
        }
      } else {
        window.addEventListener('devicemotion', handleMotion);
        window.addEventListener('deviceorientation', handleOrientation);
      }

      updateSmokeEffect();
    }

    window.addEventListener('click', initApp, { once: true });
    window.addEventListener('touchstart', initApp, { once: true });
  </script>
</body>
</html>
