<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>소방안전 AR 농연 체험</title>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: black;
    }

    #webcam-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
    }

    #smoke-container {
      position: absolute;
      top: -20vh;
      left: 0;
      width: 100vw;
      height: 140vh;
      z-index: 2;
      pointer-events: none;
      opacity: 0.98;
      transition: opacity 0.8s cubic-bezier(0.25, 1, 0.5, 1), transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
      
      mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,0.98) 60%, rgba(0,0,0,0) 95%);
      -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,0.98) 60%, rgba(0,0,0,0) 95%);
    }

    .smoke-layer-dark {
      position: absolute;
      top: -20%;
      left: -25%;
      width: 150vw;
      height: 160vh;
      background: radial-gradient(circle at 50% 40%, rgba(2, 2, 2, 1) 0%, rgba(5, 5, 5, 0.96) 60%, transparent 90%);
      filter: url(#smoke-texture-1) blur(6px);
      animation: moveDark 18s infinite ease-in-out;
    }

    .smoke-layer-gray {
      position: absolute;
      top: -10%;
      left: -20%;
      width: 140vw;
      height: 150vh;
      background: radial-gradient(circle at 45% 45%, rgba(170, 165, 160, 0.98) 0%, rgba(70, 65, 60, 0.88) 55%, transparent 90%);
      filter: url(#smoke-texture-gray) blur(8px);
      mix-blend-mode: screen;
      animation: moveGray 11s infinite ease-in-out;
    }

    .smoke-layer-light {
      position: absolute;
      top: 0%;
      left: -10%;
      width: 125vw;
      height: 140vh;
      background: radial-gradient(circle at 55% 35%, rgba(120, 120, 120, 0.85) 0%, rgba(30, 30, 30, 0.65) 55%, transparent 85%);
      filter: url(#smoke-texture-1) blur(14px);
      animation: moveLight 8s infinite ease-in-out;
    }

    @keyframes moveDark {
      0% { transform: scale(1) translate(0, 0); }
      50% { transform: scale(1.05) translate(-2%, 2%); }
      100% { transform: scale(1) translate(0, 0); }
    }

    @keyframes moveGray {
      0% { transform: scale(1.02) translate(0, 0) rotate(0deg); }
      50% { transform: scale(1.09) translate(3%, -2%) rotate(2deg); }
      100% { transform: scale(1.02) translate(0, 0) rotate(0deg); }
    }

    @keyframes moveLight {
      0% { transform: scale(1) translate(0, 0); }
      50% { transform: scale(1.06) translate(-1%, -1%); }
      100% { transform: scale(1) translate(0, 0); }
    }

    #start-notice {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 18px;
      font-weight: bold;
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid #00ffcc;
      padding: 18px 32px;
      border-radius: 30px;
      z-index: 10;
      text-align: center;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <video id="webcam-video" autoplay playsinline muted></video>

  <svg style="display:none;">
    <filter id="smoke-texture-1">
      <feTurbulence id="turbulence-1" type="fractalNoise" baseFrequency="0.012 0.018" numOctaves="4" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="55" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <filter id="smoke-texture-gray">
      <feTurbulence id="turbulence-gray" type="fractalNoise" baseFrequency="0.02 0.028" numOctaves="4" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="75" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>

  <div id="smoke-container">
    <div class="smoke-layer-dark"></div>
    <div class="smoke-layer-gray"></div>
    <div class="smoke-layer-light"></div>
  </div>

  <div id="start-notice">👆 화면을 터치하여<br>체험 시작 (권한 허용)</div>

  <script>
    const video = document.getElementById('webcam-video');
    const smokeContainer = document.getElementById('smoke-container');
    const startNotice = document.getElementById('start-notice');

    const turb1 = document.getElementById('turbulence-1');
    const turbGray = document.getElementById('turbulence-gray');

    let rawBeta = 90;
    let smoothBeta = 90;
    let animateTime = 0;

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" } },
          audio: false
        });
        video.srcObject = stream;
        await video.play();
      } catch (err) {
        alert("카메라를 불러올 수 없습니다. 브라우저를 완전히 닫았다가 다시 열어보세요.");
      }
    }

    function handleOrientation(event) {
      if (event.beta !== null && event.beta !== undefined) {
        rawBeta = Math.abs(event.beta);
      }
    }

    async function requestSensorPermission() {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const permissionState = await DeviceOrientationEvent.requestPermission();
          if (permissionState === 'granted') {
            window.addEventListener('deviceorientation', handleOrientation, true);
          } else {
            alert('동작 센서 권한이 거부되었습니다. 사파리 앱을 껐다 켜거나 주소창 좌측 aA 메뉴에서 권한을 허용해 주세요.');
          }
        } catch (error) {
          window.addEventListener('deviceorientation', handleOrientation, true);
        }
      } else {
        window.addEventListener('deviceorientation', handleOrientation, true);
      }
    }

    function updateSmokeEffect() {
      animateTime += 0.0025;
      
      const freqX1 = 0.012 + Math.sin(animateTime) * 0.003;
      const freqY1 = 0.018 + Math.cos(animateTime * 1.5) * 0.003;
      turb1.setAttribute('baseFrequency', `${freqX1} ${freqY1}`);

      const freqXG = 0.02 + Math.cos(animateTime * 1.2) * 0.005;
      const freqYG = 0.028 + Math.sin(animateTime * 1.8) * 0.005;
      turbGray.setAttribute('baseFrequency', `${freqXG} ${freqYG}`);

      smoothBeta += (rawBeta - smoothBeta) * 0.03;

      let progress = (80 - smoothBeta) / 35;
      progress = Math.min(Math.max(progress, 0.0), 1.0);

      let translateY = -(progress * 45); 
      let opacity = 0.98 - (progress * 0.73); 

      smokeContainer.style.transform = `translateY(${translateY}%)`;
      smokeContainer.style.opacity = opacity;

      requestAnimationFrame(updateSmokeEffect);
    }

    async function initApp() {
      startNotice.style.display = 'none';
      await startCamera();
      await requestSensorPermission();
      updateSmokeEffect();
    }

    startNotice.addEventListener('click', initApp);
    startNotice.addEventListener('touchstart', initApp);
  </script>
</body>
</html>
